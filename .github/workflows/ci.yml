name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the conformance suite: its position vectors are committed, so CI needs no JAX.
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy clients/pysdk clients/jax/tdg_jax conformance
      # pgx is not installed here, so the JAX client's tests skip themselves; run them in the
      # pgx environment with `JAX_PLATFORMS=cpu python -m pytest -p no:xdist clients/jax`.
      - run: pytest -q
