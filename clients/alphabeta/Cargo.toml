[package]
name = "tdg-alphabeta"
description = "A tdgauntlet client: alpha-beta search over King and Peterson's LEONIDAS heuristics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tdg-alphabeta"
path = "src/main.rs"

[dependencies]
tdg-client-kit = { path = "../../crates/client-kit" }
tdg-games = { path = "../../crates/games" }
tdg-proto = { path = "../../crates/proto" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tdg-tourney = { path = "../../crates/tourney" }
