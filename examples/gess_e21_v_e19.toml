# pgx Gess E21 (E19 continued ~5 h with the joint piece->destination policy term, gf_joint_head) against E19 (iteration 332),
# both under Gumbel MCTS at the same simulation count. Both read all six observation planes.
#
# Start the two clients first, in the pgx environment (see clients/jax/README.md), e.g.:
#   XLA_PYTHON_CLIENT_MEM_FRACTION=0.4 python -m tdg_jax --port 9431 --sims 128 --max-batch 32 \
#       --name e21 --checkpoint ~/calr3gh/pgx/checkpoints/<E21 run>/000366.ckpt
#   XLA_PYTHON_CLIENT_MEM_FRACTION=0.4 python -m tdg_jax --port 9432 --sims 128 --max-batch 32 \
#       --name e19 --checkpoint ~/calr3gh/pgx/checkpoints/gess_20260929163401/000332.ckpt
# (pgx/run_e21_followup.sh does all of this once training has finished.)
game = "gess/1"
seed = 2119
concurrency = 64
out = "../results/gess_e21_v_e19.json"

[openings]
kind = "random"
plies = 2
count = 200

[[player]]
name = "e21"
url = "http://127.0.0.1:9431"
budget_sims = 128
timeout_ms = 600000

[[player]]
name = "e19"
url = "http://127.0.0.1:9432"
budget_sims = 128
timeout_ms = 600000
