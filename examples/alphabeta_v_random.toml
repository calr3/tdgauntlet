# Alpha-beta against the random client, both started by the server.
game = "epaminondas/1"
seed = 1
concurrency = 8
out = "../results/alphabeta_v_random.json"

[openings]
kind = "random"
plies = 2
count = 20

[[player]]
name = "alphabeta"
cmd = "../target/release/tdg-alphabeta --port {port} --threads 8 --hash-mb 128"
budget_ms = 100

[[player]]
name = "random"
cmd = "../target/release/tdg-random --port {port}"
budget_ms = 100
